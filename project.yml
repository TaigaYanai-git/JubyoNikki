name: JubyoNikki

options:
  bundleIdPrefix: com.taigayanai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 367X9MY986

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0

targets:
  JubyoNikki:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Ads.xcconfig
      Release: Config/Ads.xcconfig
    dependencies:
      - package: GoogleMobileAds
      - target: JubyoNikkiWidget
    entitlements:
      path: JubyoNikki/JubyoNikki.entitlements
      properties:
        com.apple.security.application-groups: [group.com.taigayanai.jubyonikki]
    sources:
      - path: JubyoNikki
        excludes:
          - AppIcon.icon
          - JubyoNikki.entitlements
      - path: Shared
      # Icon Composer で作ったアイコン（.icon はフォルダだが1つのファイルとして扱う）
      - path: JubyoNikki/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taigayanai.jubyonikki
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: JubyoNikki/Info.plist
      properties:
        CFBundleDisplayName: 10秒日記
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # ウィジェットから開く（jubyonikki://write ですぐ 10 秒）
        CFBundleURLTypes:
          - CFBundleURLName: com.taigayanai.jubyonikki
            CFBundleURLSchemes: [jubyonikki]
        # 昨日を取り戻すときのリワード広告（AdMob）。ID は Config/Ads.xcconfig
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        AdMobRewardedUnitID: $(ADMOB_REWARDED_UNIT_ID)
        GADDelayAppMeasurementInit: true
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
