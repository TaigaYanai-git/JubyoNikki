name: JubyoNikki

options:
  bundleIdPrefix: com.taigayanai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 367X9MY986

targets:
  JubyoNikki:
    type: application
    platform: iOS
    sources:
      - path: JubyoNikki
        excludes:
          - AppIcon.icon
      # Icon Composer で作ったアイコン（.icon はフォルダだが1つのファイルとして扱う）
      - path: JubyoNikki/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taigayanai.jubyonikki
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: JubyoNikki/Info.plist
      properties:
        CFBundleDisplayName: 10秒日記
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
