  # ホーム画面のウィジェット（連続日数・今日のお題）
  JubyoNikkiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Widget.entitlements
      - path: Shared
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.taigayanai.jubyonikki]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taigayanai.jubyonikki.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 10秒日記
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
